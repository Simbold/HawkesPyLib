name: Build

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build --sdist --wheel --outdir dist/
      # Token-based publishing. Migrating to PyPI Trusted Publishing (OIDC) is
      # recommended: drop the password below, add `permissions: id-token: write`
      # to this job and register the workflow as a trusted publisher on PyPI.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.HAWKESPYLIB_RELEASE_TOKEN }}
          print-hash: true
          verbose: true
