name: Release (PyPI)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # final releases only, e.g. v0.3.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC: mint a short-lived token for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG  pyproject=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag v$TAG does not match pyproject version $VER"; exit 1; }
      - name: Build package
        run: python -m build --sdist --wheel --outdir dist/
      # Trusted Publishing (OIDC) — no secrets. Registered as a trusted publisher
      # on PyPI for repo Simbold/HawkesPyLib, workflow build_master.yml.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          verbose: true
