[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HawkesPyLib"
version = "0.3.0"
description = "Python library for simulation and inference of Hawkes processes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Simon Grimm" },
]
keywords = [
    "hawkes",
    "hawkes-process",
    "point-process",
]
classifiers = [
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numba>=0.61",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
testing = [
    "pytest>=7.4",
    "ruff>=0.5",
    "tox>=4.0",
]

[project.urls]
Homepage = "https://simbold.github.io/HawkesPyLib/"
Source = "https://github.com/Simbold/HawkesPyLib"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally assert that *some* exception is raised for invalid input.
"tests/*" = ["B017"]
